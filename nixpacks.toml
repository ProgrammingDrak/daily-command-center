# Railway/nixpacks build config for Daily Command Center.
#
# NOTE (2026-07-26): Railway's active builder is **railpack**, not nixpacks, so
# THIS file is INERT — the runtime apt packages that actually take effect live in
# `railpack.json` (`deploy.aptPackages`). This was invisible until VAULT_REPO_URL
# was set on prod and the first clone failed `spawn git ENOENT` (git-lfs/git-crypt
# from here were never installed either). Kept in sync with railpack.json in case
# the builder is ever switched back to nixpacks.
#
# The default nixpacks Node image ships none of the binaries the Mycelium vault needs:
#   - git       : SyncManager clones + pulls the vault repo (simple-git spawns the
#                 `git` binary). NOT in the runtime PATH by default — a clone with
#                 VAULT_REPO_URL set fails `spawn git ENOENT` without this (only
#                 surfaces once VAULT_REPO_URL is configured, since local-only mode
#                 never shells out to git). git-lfs depends on git at the apt level
#                 but is not guaranteed to leave `git` on the runtime PATH, so pin
#                 it explicitly.
#   - git-lfs   : the 2-10 MB media attach band commits LFS pointers (B1 found
#                 it absent on the default image); without it the vault sync's
#                 clean filter can't convert media/lfs/** to pointers.
#   - git-crypt : the sensitive-dir unlock hook (B2) decrypts health/therapy,
#                 health/moments, health/medical, journal/private + private
#                 media at boot before VaultStore indexes.
#
# aptPkgs APPENDS to the auto-detected setup phase (it does not replace the Node
# nix provider). If an apt add ever fails, the app still boots and degrades:
# SyncManager logs the missing binary, sensitive dirs stay encrypted (the
# VaultStore magic-byte guard skips them), and the attach route falls back to
# inline-only. See routes/vault.js + sync-manager.js.
[phases.setup]
aptPkgs = ["git", "git-lfs", "git-crypt"]
