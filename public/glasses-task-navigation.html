<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCC Glasses Task Navigation</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0d1722;color:#eef5ff}
body{margin:0;padding:12px}.screen{max-width:560px;margin:auto;background:#101a27;border-radius:18px;padding:16px;min-height:330px}
header{display:flex;justify-content:space-between;color:#9aadc2;font-size:12px;margin-bottom:12px}
h2{text-align:center;font-size:18px}.task{height:30px;margin:3px 0;padding:0 9px;display:flex;align-items:center;gap:8px;border-radius:5px;background:#1b2b3a;font-size:12px;overflow:hidden;white-space:nowrap}
.task span{overflow:hidden;text-overflow:ellipsis}.task.selected{background:#205442;outline:2px solid #65d9a4}.jump .task.selected{background:#284b69;outline:2px solid #84c4ff}.jump .task.range{border-left:4px solid #3272a5}
.taskview{display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:65px 200px 65px;align-items:center;text-align:center;gap:4px}
.taskview .top,.taskview .bottom{grid-column:2}.taskview .center{border:2px solid #66dca1;border-radius:90px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:8px}.taskview .center strong{font-size:17px}.taskview small{color:#b3c3d5}.action{font-size:22px}.action small{display:block;font-size:10px}
footer{display:flex;justify-content:space-between;color:#a6c8e8;font-size:12px;margin-top:12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:14px auto}
button{border:1px solid #40566b;border-radius:10px;padding:12px;background:#213447;color:white;touch-action:none;user-select:none;font:inherit}
button:active{background:#355b78}.wide{grid-column:1/4}#feedback{max-width:560px;margin:auto;color:#b5c9d9;font-size:12px;min-height:30px}
#undo{color:#77e5ad}.select header{color:#65d9a4}.jump header{color:#84c4ff}
</style>
<div class="screen" id="screen"><header><span id="mode"></span><span id="position"></span></header><h2 id="collection"></h2><main id="content"></main><footer><span>↶ Middle: Back</span><span id="hint"></span></footer></div>
<div class="keypad">
<div></div><button data-input="up">↑ Swipe up</button><div></div>
<button data-input="left">← Swipe left</button><button data-input="fore">Forefinger</button><button data-input="right">Swipe right →</button>
<div></div><button data-input="down">↓ Swipe down</button><div></div>
<button class="wide" data-input="middle">Middle finger · Back</button>
</div><div id="feedback" role="status" aria-live="polite">Tap, double tap, or hold a finger button.</div>
<script>
const collections=['All Tasks','Working Queue','Itinerary','Loose Ends','Unscheduled','Whenever','Someday','Waiting'];
const sections=['Foreground','Needs You','Background','Priority Queue'];
const demo=Array.from({length:24},(_,i)=>({id:'demo-'+i,title:['Review investor agreements','Follow up with agents','Test QuietShelf','Review DCC changes','Finish investor outreach','Check GitHub PRs'][i%6],status:'Not started',priority:i%5+1,section:sections[Math.min(3,Math.floor(i/6))]}));
let groups=collections.map((_,i)=>i===1?demo:demo.filter((_,j)=>i===0||j%(i+2)!==0));
let collection=0,level=0,positions=collections.map(()=>0),undo=null,undoTimer=null,pending=null,tapTimer=null;
const $=id=>document.getElementById(id);
function tasks(){return groups[collection]}function current(){return tasks()[positions[collection]]}
function draw(){const items=tasks(),index=Math.min(positions[collection],Math.max(0,items.length-1));positions[collection]=index;
$('screen').className='screen '+['jump','select','task','details'][level];
$('mode').textContent=['JUMP VIEW ×5','SELECT VIEW ×1','TASK VIEW','TASK DETAILS'][level];
$('position').textContent=items.length?(index+1)+' / '+items.length:'0 / 0';
$('collection').textContent=collections[collection];$('content').replaceChildren();
if(level<2){const start=Math.max(0,Math.min(index-5,Math.max(0,items.length-11)));
items.slice(start,start+11).forEach((item,i)=>{const absolute=start+i,row=document.createElement('div');row.className='task'+(absolute===index?' selected':'')+(level===0&&Math.abs(absolute-index)<=2?' range':'');
const num=document.createElement('b');num.textContent=absolute+1;const title=document.createElement('span');title.textContent=(collection===1?item.section+' · ':'')+item.title;row.append(num,title);$('content').append(row)})}
else if(level===2&&current()){$('content').innerHTML='<div class="taskview"><div class="top action">↑<small>Foreground</small></div><div class="action">✓<small>Complete</small></div><div class="center"><strong></strong><small></small><span style="color:#77e5ad">◎ Tap to complete</span></div><div class="action">⊖<small>Remove</small></div><div class="bottom action">•••<small>More actions</small></div></div>';
$('content').querySelector('strong').textContent=current().title;$('content').querySelector('.center small').textContent='Priority '+current().priority+' · '+current().status}
else if(level===3){const h=document.createElement('h2');h.textContent=current()?.title||'Task';const p=document.createElement('p');p.textContent='Task details placeholder — full design deferred.';$('content').append(h,p)}
$('hint').textContent=undo?'↶↶ Undo '+Math.ceil((undo.expires-Date.now())/1000)+'s':level===0?'← → Collections':level===2?'Hold forefinger: Details':'';
}
function announce(s){$('feedback').textContent=s;draw()}
function complete(){const item=current();if(!item)return;const original={collection,index:positions[collection],item};groups=groups.map(group=>group.filter(t=>t.id!==item.id));positions=positions.map((p,i)=>Math.min(p,Math.max(0,groups[i].length-1)));level=1;undo={...original,expires:Date.now()+5000};clearInterval(undoTimer);undoTimer=setInterval(()=>{if(!undo)return;if(Date.now()>=undo.expires){undo=null;clearInterval(undoTimer)}draw()},100);announce('Completed '+item.title+' · double middle tap within 5s to undo')}
function restore(){if(!undo)return;const {item,index}=undo;groups=groups.map((group,i)=>{if(i===0||i===1||i===undo.collection){if(!group.some(t=>t.id===item.id)){const copy=group.slice();copy.splice(Math.min(index,copy.length),0,item);return copy}}return group});undo=null;clearInterval(undoTimer);announce('Completion undone')}
function input(action){if(action==='middle-double'){if(undo&&Date.now()<undo.expires)restore();else{collection=0;level=0;announce('All Tasks · Jump View')}return}
if(action==='middle'){level=Math.max(0,level-1);announce('Back');return}
if(action==='fore-hold'){if(level===2){level=3;announce('Task Details')}else announce('Hold reserved');return}
if(action==='middle-hold'||action==='fore-double'){announce('Gesture reserved');return}
if(action==='fore'){if(level===2){complete();return}if(level<2&&tasks().length){level++;announce('Opened '+(level===1?'Select View':'Task View'))}return}
if(level===0&&(action==='left'||action==='right')){collection=Math.max(0,Math.min(collection+(action==='left'?1:-1),collections.length-1));announce('Collection: '+collections[collection]);return}
if(level<2&&(action==='up'||action==='down')){positions[collection]=Math.max(0,Math.min(tasks().length-1,positions[collection]+(action==='up'?-1:1)*(level===0?5:1)));announce('Task '+(positions[collection]+1));return}
if(level===2){if(action==='left')complete();else announce({right:'Remove from Priority (requires DCC API)',up:'Move to Foreground (requires DCC API)',down:'More Actions (future menu)'}[action]||'');return}
announce('No action assigned')}
function finger(g){if(pending===g){pending=null;clearTimeout(tapTimer);input(g+'-double')}else{if(pending){clearTimeout(tapTimer);input(pending)}pending=g;tapTimer=setTimeout(()=>{pending=null;input(g)},340)}}
document.querySelectorAll('button[data-input]').forEach(button=>{const g=button.dataset.input;let hold,held=false,down=false;
button.addEventListener('pointerdown',()=>{if(g!=='fore'&&g!=='middle')return;down=true;held=false;hold=setTimeout(()=>{if(down){held=true;pending=null;clearTimeout(tapTimer);input(g+'-hold')}},550)});
button.addEventListener('pointerup',()=>{down=false;clearTimeout(hold)});
button.addEventListener('pointercancel',()=>{down=false;held=true;clearTimeout(hold)});
button.addEventListener('click',()=>{if(held){held=false;return}if(g==='fore'||g==='middle')finger(g);else input(g)});
button.addEventListener('contextmenu',e=>e.preventDefault())});
draw();
</script></html>
