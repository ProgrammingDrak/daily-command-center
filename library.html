<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Library | Daily Command Center</title>
    <link rel="icon" href="/public/icons/favicon.ico" />
    <link rel="manifest" href="/public/ink-manifest.webmanifest" />
    <meta name="theme-color" content="#09111f" />
    <link rel="stylesheet" href="/public/css/tokens.css" />
    <link rel="stylesheet" href="/public/css/dashboard.css" />
    <link rel="stylesheet" href="/public/css/core-ui.css" />
    <link rel="stylesheet" href="/public/css/ui-optimization.css" />
    <link rel="stylesheet" href="/public/css/completion-memories.css" />
    <link rel="stylesheet" href="/public/css/journal-sketchbook.css?v=library-1" />
    <link rel="stylesheet" href="/public/css/library.css?v=library-menu-1" />
  </head>
  <body class="library-app">
    <header class="header dcc-topbar">
      <h1 class="dcc-visually-hidden">Daily Command Center</h1>
      <nav class="dcc-pages" aria-label="Pages">
        <a class="tab" href="/">Tasks</a><a class="tab" href="/?tab=budget">Budget</a
        ><a class="tab" href="/?tab=activity">Workouts &amp; meals</a
        ><a class="tab" href="/research">Research &amp; Ideas</a><a class="tab" href="/places">Places</a
        ><a class="tab active" href="/library" aria-current="page">Library</a>
      </nav>
      <a class="admin-link" href="/">Back to DCC</a>
    </header>
    <main id="library-root" aria-label="Library"><p role="status">Opening your Library…</p></main>
    <p id="library-status" class="lr-live" role="status" aria-live="polite"></p>
    <dialog id="library-rename-dialog" class="lr-dialog">
      <form>
        <h2>Rename notebook</h2>
        <label>Notebook title<input name="title" required maxlength="120" autocomplete="off" /></label>
        <div class="lr-actions">
          <button class="lr-button" type="button" data-cancel>Cancel</button
          ><button class="lr-button primary" type="submit">Rename</button>
        </div>
      </form>
    </dialog>
    <dialog id="library-delete-dialog" class="lr-dialog" aria-labelledby="library-delete-title">
      <h2 id="library-delete-title">Delete notebook?</h2>
      <p data-message></p>
      <p class="lr-dialog-error" data-error role="alert"></p>
      <div class="lr-actions">
        <button class="lr-button" type="button" data-cancel>Cancel</button
        ><button class="lr-button danger" type="button" data-confirm>Delete</button>
      </div>
    </dialog>
    <dialog id="library-dialog" class="lr-dialog">
      <form>
        <h2>New notebook</h2>
        <label>Notebook title<input name="title" required maxlength="120" autocomplete="off" /></label>
        <div class="lr-actions">
          <button class="lr-button" type="button" data-cancel>Cancel</button
          ><button class="lr-button primary" type="submit">Create notebook</button>
        </div>
      </form>
    </dialog>
    <script src="/public/js/vendor/marked.min.js"></script>
    <script src="/public/js/vendor/purify.min.js"></script>
    <script src="/public/js/ink/strokes.js?v=library-1"></script>
    <script src="/public/js/ink/canvas.js?v=library-1"></script>
    <script src="/public/js/ink/shapes.js"></script>
    <script src="/public/js/ink/store.js"></script>
    <script src="/public/js/ink/archive.js"></script>
    <script src="/public/js/ink/sync.js"></script>
    <script src="/public/js/journal-notebook.js?v=library-1"></script>
    <script src="/public/js/journal-sketchbook.js?v=college-default-1"></script>
    <script src="/public/js/journal-drafts.js?v=library-delete-1"></script>
    <script src="/public/js/library-workspace.js?v=library-delete-1"></script>
    <script src="/public/js/core-ui.js"></script>
    <script src="/public/js/journal-blocks.js?v=library-1"></script>
    <script src="/public/js/completion-memories.js?v=library-1"></script>
  </body>
</html>
