<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Command Center — Account</title>
  <link rel="stylesheet" href="/public/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 18%, rgba(59,130,246,0.12), transparent 34%),
        radial-gradient(circle at 18% 82%, rgba(99,102,241,0.08), transparent 28%),
        #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 28px 30px 30px;
      width: min(100%, 460px);
      min-width: 0;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .logo p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .auth-tab {
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 10px;
      transition: background 0.15s, color 0.15s;
    }

    .auth-tab.active {
      background: #2d3148;
      color: #f1f5f9;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    input::placeholder { color: #475569; }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 42px;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .toggle-pw:hover { color: #94a3b8; }

    .btn {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }

    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error.visible { display: block; }

    .managed-auth { margin-bottom: 18px; }
    .managed-auth[hidden] { display: none; }

    .auth-option-label {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      text-align: center;
      text-transform: uppercase;
    }

    .auth-provider-status {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      padding: 11px 14px;
      text-align: center;
    }

    .auth-provider-status.unavailable { color: #94a3b8; }

    .clerk-mount { display: none; width: 100%; min-width: 0; }
    .clerk-mount.visible { display: block; }
    .clerk-mount :where(.cl-rootBox, .cl-cardBox, .cl-card, .cl-main) {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
    }
    .clerk-mount :where(.cl-socialButtonsBlockButton) {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
    }
    #clerkSignIn .cl-signIn-start :where(.cl-header, .cl-form, .cl-dividerRow, .cl-footer) {
      display: none !important;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin: 18px 0 0;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #2d3148; }
    .divider span { padding: 0 12px; }

    .fine-print {
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
      margin-top: 14px;
      text-align: center;
    }

    .auth-progress {
      display: none;
      width: min(100%, 430px);
      min-height: 430px;
      place-items: center;
      text-align: center;
    }
    html.auth-verifying .auth-progress { display: grid; }
    html.auth-verifying .card { display: none; }
    .auth-progress-card {
      width: 100%;
      padding: 44px 32px;
      border: 1px solid #2d3148;
      border-radius: 20px;
      background: linear-gradient(155deg, rgba(30,35,57,0.97), rgba(22,25,41,0.98));
      box-shadow: 0 28px 80px rgba(0,0,0,0.48), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .auth-orbit {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }
    .auth-orbit::before, .auth-orbit::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(96,165,250,0.2);
    }
    .auth-orbit::before {
      border-top-color: #60a5fa;
      border-right-color: #818cf8;
      animation: auth-spin 1.15s linear infinite;
    }
    .auth-orbit::after {
      inset: 12px;
      border-color: rgba(99,102,241,0.18);
      border-bottom-color: #6366f1;
      animation: auth-spin 1.8s linear infinite reverse;
    }
    .auth-orbit-icon {
      position: relative;
      z-index: 1;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      font-size: 25px;
      box-shadow: 0 10px 28px rgba(59,130,246,0.34);
      animation: auth-pulse 1.6s ease-in-out infinite;
    }
    .auth-progress-kicker {
      color: #60a5fa;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }
    .auth-progress h1 { color: #f8fafc; font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .auth-progress-copy { max-width: 310px; margin: 10px auto 0; color: #94a3b8; font-size: 14px; line-height: 1.55; }
    .auth-dots { display: flex; justify-content: center; gap: 7px; margin-top: 25px; }
    .auth-dots span { width: 6px; height: 6px; border-radius: 50%; background: #60a5fa; animation: auth-dot 1.2s ease-in-out infinite; }
    .auth-dots span:nth-child(2) { animation-delay: 0.16s; }
    .auth-dots span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes auth-spin { to { transform: rotate(360deg); } }
    @keyframes auth-pulse { 50% { transform: scale(1.06); box-shadow: 0 14px 34px rgba(99,102,241,0.42); } }
    @keyframes auth-dot { 0%, 60%, 100% { opacity: 0.28; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .auth-orbit::before, .auth-orbit::after, .auth-orbit-icon, .auth-dots span { animation: none; }
    }
    @media (max-width: 480px) {
      body { align-items: flex-start; }
      .card { padding: 24px 20px 26px; border-radius: 14px; }
      .auth-progress { min-height: calc(100dvh - 40px); }
      .auth-progress-card { padding: 38px 22px; }
    }
    body { font-family: var(--font-sans); background: var(--surface-page); color: var(--ink); }
    .card, .auth-progress-card { background: var(--surface-base); border-color: var(--line); }
    .logo h1, .auth-progress h1 { color: var(--ink-strong); }
    .logo p, label, .fine-print, .auth-progress-copy { color: var(--ink-muted); }
    .logo-icon, .auth-orbit-icon, .btn { background: var(--brand); }
    input, .auth-tabs, .auth-provider-status { min-height: var(--target-min); background: var(--surface-sunken); border-color: var(--line); color: var(--ink); }
    .auth-tab, .btn, .toggle-pw { min-height: var(--target-min); }
    :focus-visible { outline: var(--focus-size) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  </style>
  <script>
    (function markOAuthReturnBeforePaint() {
      try {
        const params = new URLSearchParams(window.location.search);
        const pendingAt = Number(sessionStorage.getItem("dcc-clerk-pending") || 0);
        const recentlyPending = pendingAt > 0 && Date.now() - pendingAt < 5 * 60 * 1000;
        if (params.get("auth") === "verifying" || recentlyPending) {
          document.documentElement.classList.add("auth-verifying");
        } else if (pendingAt) {
          sessionStorage.removeItem("dcc-clerk-pending");
        }
      } catch {}
    })();
  </script>
</head>
<body>
  <main class="auth-progress" id="authProgress" role="status" aria-live="polite" aria-busy="true">
    <div class="auth-progress-card">
      <div class="auth-orbit" aria-hidden="true"><div class="auth-orbit-icon">&#9889;</div></div>
      <p class="auth-progress-kicker">Daily Command Center</p>
      <h1 id="authProgressTitle">Verifying your sign-in...</h1>
      <p class="auth-progress-copy" id="authProgressCopy">Google said hello. We are opening your command center now.</p>
      <div class="auth-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>Daily Command Center</h1>
      <p id="authSubtitle">Sign in to continue</p>
    </div>

    <div class="error" id="error" role="alert" aria-live="assertive"></div>

    <section id="managedAuth" class="managed-auth" aria-label="Single sign-on options">
      <p class="auth-option-label">Fast sign in</p>
      <div id="authProviderStatus" class="auth-provider-status" role="status">Loading secure sign-in options...</div>
      <div id="clerkSignIn" class="clerk-mount"></div>
      <div id="clerkDivider" class="divider"><span id="clerkDividerText">or use your username or email</span></div>
    </section>

    <div class="auth-tabs" aria-label="Account access">
      <button type="button" class="auth-tab active" id="loginTab" aria-pressed="true">Sign in</button>
      <button type="button" class="auth-tab" id="registerTab" aria-pressed="false">Register</button>
    </div>

    <form id="authForm">
      <div class="form-group">
        <label for="username" id="usernameLabel">Username or email</label>
        <input type="text" id="username" name="username" placeholder="drake or you@example.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-group hidden" id="confirmGroup">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign in</button>
      <p class="fine-print" id="authFinePrint">New here? Choose Register to create your workspace.</p>
    </form>
  </div>

  <script>
    let mode = window.location.pathname === "/register" ? "register" : "login";

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const subtitle = document.getElementById("authSubtitle");
    const confirmGroup = document.getElementById("confirmGroup");
    const confirmInput = document.getElementById("confirmPassword");
    const finePrint = document.getElementById("authFinePrint");
    const togglePw = document.getElementById("togglePw");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    const usernameInput = document.getElementById("username");
    const usernameLabel = document.getElementById("usernameLabel");
    const clerkDividerText = document.getElementById("clerkDividerText");

    function setMode(nextMode, pushState = true) {
      mode = nextMode;
      const isRegister = mode === "register";
      loginTab.classList.toggle("active", !isRegister);
      registerTab.classList.toggle("active", isRegister);
      loginTab.setAttribute("aria-pressed", String(!isRegister));
      registerTab.setAttribute("aria-pressed", String(isRegister));
      subtitle.textContent = isRegister ? "Create an account to continue" : "Sign in to continue";
      confirmGroup.classList.toggle("hidden", !isRegister);
      confirmInput.required = isRegister;
      usernameLabel.textContent = isRegister ? "Username" : "Username or email";
      usernameInput.placeholder = isRegister ? "drake" : "drake or you@example.com";
      clerkDividerText.textContent = isRegister ? "or create with a username" : "or use your username or email";
      passwordInput.autocomplete = isRegister ? "new-password" : "current-password";
      document.title = isRegister ? "Daily Command Center — Register" : "Daily Command Center — Sign In";
      btn.textContent = isRegister ? "Create Account" : "Sign in";
      finePrint.textContent = isRegister ? "Usernames use lowercase letters, numbers, hyphens, or underscores." : "New here? Choose Register to create your workspace.";
      errorEl.classList.remove("visible");
      if (pushState) {
        const params = window.location.search || "";
        window.history.replaceState(null, "", (isRegister ? "/register" : "/login") + params);
      }
    }

    togglePw.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePw.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      eyeIcon.innerHTML = isHidden
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
           <circle cx="12" cy="12" r="3"/>`;
    });

    const form = document.getElementById("authForm");
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("submitBtn");

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      btn.disabled = true;
      btn.textContent = mode === "register" ? "Creating account…" : "Signing in…";

      const rawUsername = usernameInput.value.trim();
      const username = mode === "register" ? rawUsername.toLowerCase() : rawUsername;
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (mode === "register" && password !== confirmPassword) {
        errorEl.textContent = "Passwords do not match.";
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Create Account";
        return;
      }

      if (mode === "register" && !/^[a-z0-9_-]{3,30}$/.test(username)) {
        errorEl.textContent = "Username must be 3-30 lowercase letters, numbers, hyphens, or underscores.";
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Create Account";
        return;
      }

      try {
        const res = await fetch(mode === "register" ? "/api/auth/register" : "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
          credentials: "include"
        });

        const data = await res.json();
        if (res.ok) {
          // Redirect to the app (or the originally requested page)
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
        } else {
          errorEl.textContent = data.error || (mode === "register" ? "Registration failed." : "Sign in failed. Check your credentials.");
          errorEl.classList.add("visible");
          btn.disabled = false;
          btn.textContent = mode === "register" ? "Create Account" : "Sign in";
        }
      } catch {
        errorEl.textContent = "Network error — is the server running?";
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = mode === "register" ? "Create Account" : "Sign in";
      }
    });

    setMode(mode, false);

  </script>
  <script type="module">
    // ── Managed login widget via the shared drake-auth kit ──
    // The config fetch, publishable-key decode, clerk.browser.js load, widget
    // mount, and token→dcc_session sync all live in the package (identical
    // across Drake's apps). This page supplies DCC's appearance and keeps the
    // app-owned credential fallback visible. If no Clerk keys are configured server-side the
    // module reports "no-key" and the username/password form stays as-is.
    import { initClerkAuth } from "/vendor/drake-auth/browser.js";

    const errorEl = document.getElementById("error");
    const managedAuthEl = document.getElementById("managedAuth");
    const mountEl = document.getElementById("clerkSignIn");
    const providerStatusEl = document.getElementById("authProviderStatus");
    const progressTitle = document.getElementById("authProgressTitle");
    const progressCopy = document.getElementById("authProgressCopy");
    const CLERK_PENDING_KEY = "dcc-clerk-pending";

    function rememberClerkHandoff() {
      try { sessionStorage.setItem(CLERK_PENDING_KEY, String(Date.now())); } catch {}
    }

    function clearClerkHandoff() {
      try { sessionStorage.removeItem(CLERK_PENDING_KEY); } catch {}
      const params = new URLSearchParams(window.location.search);
      if (!params.has("auth")) return;
      params.delete("auth");
      const query = params.toString();
      window.history.replaceState(null, "", window.location.pathname + (query ? "?" + query : ""));
    }

    function showAuthProgress(title, copy) {
      if (title) progressTitle.textContent = title;
      if (copy) progressCopy.textContent = copy;
      document.documentElement.classList.add("auth-verifying");
    }

    function hideAuthProgress() {
      document.documentElement.classList.remove("auth-verifying");
    }

    function failClerkReturn(message) {
      const wasVerifying = document.documentElement.classList.contains("auth-verifying");
      clearClerkHandoff();
      hideAuthProgress();
      if (wasVerifying) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }
    }

    // Render Clerk's widget chrome-less so it sits inside our own .card as
    // a single, unified card (no card-in-a-card).
    const appearance = {
      variables: {
        colorBackground: "#1a1d2e",
        colorPrimary: "#3b82f6",
        colorText: "#e2e8f0",
        colorTextSecondary: "#94a3b8",
        colorInputBackground: "#0f1117",
        colorInputText: "#e2e8f0",
        colorNeutral: "#e2e8f0",
        borderRadius: "8px",
      },
      elements: {
        rootBox: { width: "100%", maxWidth: "100%", minWidth: "0" },
        cardBox: { width: "100%", maxWidth: "100%", minWidth: "0", boxShadow: "none", border: "none" },
        card: { width: "100%", maxWidth: "100%", minWidth: "0", boxShadow: "none", border: "none", backgroundColor: "transparent", padding: "0" },
        main: { width: "100%", maxWidth: "100%", minWidth: "0" },
        socialButtonsBlockButton: { width: "100%", maxWidth: "100%", minWidth: "0" },
      },
    };

    const returnParams = new URLSearchParams(window.location.search);
    returnParams.set("auth", "verifying");
    const authReturnUrl = "/login?" + returnParams.toString();

    const ctrl = await initClerkAuth({
      el: mountEl,
      appearance,
      // The query flag renders the progress state before the shared Clerk
      // module loads, preventing the login card from flashing after OAuth.
      redirectUrl: authReturnUrl,
      onSignedIn: () => {
        const params = new URLSearchParams(window.location.search);
        const destination = params.get("next") || "/";
        clearClerkHandoff();
        window.location.href = destination;
      },
      onError: (e) => {
        failClerkReturn(e.message || "Sign-in could not be completed.");
      },
      onUnavailable: (reason) => {
        if (reason === "no-key") {
          managedAuthEl.hidden = true;
          return;
        }
        providerStatusEl.textContent = "Google sign-in is temporarily unavailable. Use your username or email below.";
        providerStatusEl.classList.add("unavailable");
        console.warn("Social login unavailable");
        if (document.documentElement.classList.contains("auth-verifying")) {
          failClerkReturn("We could not reconnect to Google sign-in. Please try again.");
        }
      },
    });

    // Keep every sign-in method in one card. Clerk owns only the social-provider
    // row; DCC's username/email and password form remains visible underneath.
    if (ctrl.clerk && !ctrl.clerk.user) {
      providerStatusEl.hidden = true;
      mountEl.classList.add("visible");
      mountEl.addEventListener("pointerdown", (event) => {
        const button = event.target.closest && event.target.closest("button");
        if (button && /google/i.test(button.textContent || button.getAttribute("data-localization-key") || "")) {
          rememberClerkHandoff();
        }
      }, true);
    }

    if (document.documentElement.classList.contains("auth-verifying") && (!ctrl.clerk || !ctrl.clerk.user)) {
      showAuthProgress();
      setTimeout(() => {
        if (document.documentElement.classList.contains("auth-verifying")) {
          failClerkReturn("Google did not finish the sign-in. Please try again.");
        }
      }, 10000);
    }
  </script>
</body>
</html>
