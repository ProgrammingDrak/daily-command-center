<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <title>Research & Ideas · Daily Command Center</title>
    <link rel="icon" href="/public/icons/favicon.ico" />
    <link rel="stylesheet" href="/public/css/tokens.css" />
    <link rel="stylesheet" href="/public/css/wishlists.css" />
    <link rel="stylesheet" href="/public/css/research.css" />
    <script defer src="/public/js/vendor/marked.min.js"></script>
    <script defer src="/public/js/vendor/purify.min.js"></script>
    <script defer src="/public/js/wishlist-pricing.js"></script>
    <script defer src="/public/js/research-sync.js"></script>
    <script defer src="/public/js/research.js"></script>
  </head>
  <body>
    <header class="top">
      <a href="/">Daily Command Center</a><a href="/research">Research & Ideas</a><a href="/wishlists">Wishlists</a
      ><span id="environment" hidden></span><button id="sync-status" type="button">Connecting…</button>
    </header>
    <main>
      <div id="feedback" role="status" aria-live="polite"></div>
      <div id="view" aria-busy="true">
        <h1>Research & Ideas</h1>
        <p>Loading…</p>
      </div>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="dialog-header">
        <h2 id="editor-title"></h2>
        <button id="close-editor" type="button">Close</button>
      </div>
      <div id="editor-body"></div>
      <p id="editor-status" role="status" aria-live="polite"></p>
    </dialog>
  </body>
</html>
