plugins { id 'com.android.application' }
android {
    namespace 'com.drake.dccalarm'
    compileSdk 35
    defaultConfig { applicationId 'com.drake.dccalarm'; minSdk 31; targetSdk 35; versionCode 2; versionName '0.2' }
    buildTypes { debug { signingConfig = null } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "androidx.webkit:webkit:1.12.1"; testImplementation "junit:junit:4.13.2"; testImplementation "org.robolectric:robolectric:4.14.1" }
android.testOptions.unitTests.includeAndroidResources = true
