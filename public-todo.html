<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<link rel="icon" href="/public/icons/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="32x32" href="/public/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/public/icons/favicon-16x16.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Todo List</title>
  <link rel="stylesheet" href="/public/css/tokens.css">
  <link rel="stylesheet" href="/public/css/dashboard.css">
  <link rel="stylesheet" href="/public/css/ui-optimization.css">
  <link rel="stylesheet" href="/public/css/core-ui.css">
<style>
[data-condition-editor]{flex-basis:100%;min-width:0;width:100%}
[data-condition-editor] button,[data-condition-editor] select{min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;padding:6px 10px;max-width:100%}
.reward-condition-group{margin:8px 0 8px calc(var(--condition-depth)*8px);padding:8px;border:1px solid var(--border);border-radius:8px;min-width:0}
.reward-condition-group summary{cursor:pointer;min-height:44px;display:flex;align-items:center;overflow-wrap:anywhere}
.reward-condition-group label{display:flex;align-items:center;gap:8px;min-height:44px}
.reward-condition-group input[type=checkbox]{width:18px;flex:none}
.reward-condition-picker{max-height:240px;overflow:auto}
.reward-condition-members{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reward-condition-members span{display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow-wrap:anywhere}
.reward-condition-group summary::before{content:"▸";margin-right:6px}.reward-condition-group[open]>summary::before,.reward-condition-picker[open]>summary::before{content:"▾"}
.reward-condition-help,.reward-condition-error{font-size:12px;line-height:1.5;opacity:.8}
</style></head>
<body class="todo-public-body guest-mode">
  <main class="todo-public-shell">
    <section class="todo-public-hero">
      <div>
        <h1 id="todo-public-title">Shared Todo List</h1>
        <p id="todo-public-subtitle">A live view of today's active list.</p>
      </div>
      <div class="todo-public-actions">
        <a class="todo-public-login" href="/login">Sign in</a>
        <a class="todo-public-login primary" href="/register">Create account</a>
      </div>
    </section>

    <section id="todo-public-status" class="todo-public-error" role="status">Loading shared list…</section>
    <section id="todo-public-error" class="todo-public-error" hidden></section>

    <section id="todo-public-content" class="todo-public-grid" hidden>
      <section class="todo-public-main">
        <div class="todo-public-toolbar">
          <div>
            <strong id="todo-public-date">Today</strong>
            <span id="todo-public-updated">Live</span>
          </div>
          <div class="todo-public-stats">
            <span><b id="todo-stat-open">0</b> open</span>
            <span><b id="todo-stat-done">0</b> done</span>
            <span><b id="todo-stat-sponsored">0</b> sponsored</span>
          </div>
        </div>
        <p id="task-access-context" class="task-access-context" role="status"></p>
        <div class="todo-public-controls" aria-label="Feed controls">
          <div class="shared-filter-pills" role="group" aria-label="Task types">
            <button type="button" data-type-filter="task" aria-pressed="true">Tasks</button>
            <button type="button" data-type-filter="repeat" aria-pressed="true">Repeat</button>
            <button type="button" data-type-filter="calendar" aria-pressed="true">Calendar</button>
            <button type="button" data-type-filter="time" aria-pressed="true">Breaks / OOO</button>
            <button type="button" data-types-all>Show all</button><button type="button" data-types-none>Remove all</button>
          </div>
          <div class="shared-filter-pills" role="group" aria-label="Completion status">
            <button type="button" data-status-filter="open" aria-pressed="true">Open</button>
            <button type="button" data-status-filter="done" aria-pressed="true">Done</button>
            <button type="button" id="todo-filter-sponsored" aria-pressed="false">With rewards</button>
          </div>
          <button id="todo-suggest-task" class="todo-public-btn primary" type="button">Suggest a Task</button>
          <details class="shared-filter-more"><summary>More filters &amp; export</summary>
          <label>Calendar
            <select id="todo-filter-calendar">
              <option value="all">All calendars</option>
            </select>
          </label>
          <label>Sort
            <select id="todo-sort">
              <option value="time">Time</option>
              <option value="type">Type</option>
              <option value="status">Status</option>
              <option value="title">Title</option>
              <option value="duration">Duration</option>
            </select>
          </label>

          <!-- Export: for the visitor who is never going to open DCC. Takes the
               list they are looking at (same filters, same sort) into whatever
               their own system reads. Single-day formats serialize client-side
               from the loaded payload; a range hands off to the server route. -->
          <div class="todo-export" id="todo-export">
            <span class="todo-export-label" id="todo-export-label">Export</span>
            <button id="todo-export-button" class="todo-filter-menu-button" type="button"
                    aria-haspopup="true" aria-expanded="false"
                    aria-labelledby="todo-export-label todo-export-button">Download</button>
            <div id="todo-export-menu" class="todo-filter-menu todo-export-menu" hidden>
              <button type="button" class="todo-export-item" data-export="csv">
                <span>CSV</span><small>Import into any task app or spreadsheet</small>
              </button>
              <button type="button" class="todo-export-item" data-export="ics">
                <span>Calendar (.ics)</span><small>Drop the day into your own calendar</small>
              </button>
              <button type="button" class="todo-export-item" data-export="md">
                <span>Markdown</span><small>Paste straight into a Google Doc</small>
              </button>
              <button type="button" class="todo-export-item" data-export="pdf">
                <span>PDF</span><small>Print-ready one pager</small>
              </button>
              <div class="todo-export-range">
                <label>Range
                  <select id="todo-export-range">
                    <option value="day">This day</option>
                    <option value="7">Next 7 days</option>
                    <option value="30">Next 30 days</option>
                  </select>
                </label>
                <small id="todo-export-range-note">Exports exactly the rows shown above.</small>
              </div>
            </div>
          </div>
          </details>
        </div>

        <p id="todo-suggestion-feedback" role="status" aria-live="polite"></p>

        <div id="todo-public-list" class="todo-public-list tl"></div>
      </section>
    </section>
  </main>
  <!-- core.js FIRST, same as index.html. It was missing here, and this page's
       `esc()` delegates straight to `window.DCC.esc` — so the very first render
       threw "Cannot read properties of undefined" and the shared list published
       an error banner and NO TASKS to whoever held the link. The controls still
       drew, which is why it read as an empty day rather than a broken page.
       Found while adding the export bar; the break predates it. -->
  <script src="/public/js/core.js"></script>
  <script src="/public/js/core-ui.js"></script>
  <script src="/public/js/time-picker.js"></script>
  <script src="/public/js/shared-task-suggestions.js"></script>
  <script src="/public/js/time-blocks.js?v=time-blocks-1"></script>
<script src="/public/js/time-block-view.js"></script>
  <script src="/public/js/task-action-policy.js"></script>
<script src="/public/js/task-actions.js"></script>
<script src="/public/js/itinerary-card.js"></script>
  <script src="/public/js/share-export.js"></script>
  <script src="/public/js/reward-conditions.js"></script>
  <script src="/public/js/reward-condition-editor.js"></script>
  <script src="/public/js/public-todo-share.js"></script>
<footer style="padding: 0.75rem; text-align: center"><a href="/source">Source and license</a></footer>
</body>
</html>
